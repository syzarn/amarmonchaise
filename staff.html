<!DOCTYPE html>
<html lang="bn" dir="ltr" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta http-equiv="content-language" content="bn, en" />
  <meta name="robots" content="noindex, nofollow" />

  <title id="page-title">মঞ্চাইছে স্টাফ ও বিতরণ পোর্টাল | Staff Dispatch Portal — Mon Chaise</title>
  <meta name="description" content="মঞ্চাইছে (Mon Chaise) অভ্যন্তরীণ মোবাইল স্টাফ ও পার্সেল বিতরণ ব্যবস্থাপনা পোর্টাল।" />

  <!-- PWA & Mobile Web App Meta -->
  <link rel="manifest" href="./staff.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="MC Staff" />
  <meta name="theme-color" content="#166B58" />
  <link rel="apple-touch-icon" href="./files/monchaise_stamp.png" />
  <link rel="icon" type="image/svg+xml" href="./files/monchaise_logo_green.svg" id="app-favicon" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            paper: '#FCFBF7',
            amoled: '#040406',
            greenAccent: {
              500: '#1e7e68',
              600: '#166b58',
              700: '#125446'
            },
            crimson: {
              600: '#bd3a54',
              700: '#991b1b'
            },
            gold: {
              400: '#ffd533',
              500: '#f2c200'
            }
          }
        }
      }
    }
  </script>

  <!-- Typography and styles -->
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./styles/saru.css" />

  <style>
    /* 18th-century Print-Press Broadside Aesthetics */
    .print-press-card {
      background-color: #FCFBF7;
      border: 2px solid #166B58;
      box-shadow: 3px 3px 0px #166B58;
      border-radius: 4px;
    }
    .dark .print-press-card {
      background-color: #0c0f0d;
      border: 2px solid #f2c200;
      box-shadow: 3px 3px 0px #f2c200;
    }
    .chapter-badge {
      background: #166B58;
      color: #FCFBF7;
      border: 1px solid #166B58;
      box-shadow: 2px 2px 0px #BD3A54;
    }
    .dark .chapter-badge {
      background: #f2c200;
      color: #000;
      border: 1px solid #f2c200;
      box-shadow: 2px 2px 0px #1e7e68;
    }
    .craft-tag-pill {
      border: 1.5px solid #166B58;
      background: rgba(22, 107, 88, 0.08);
      color: #166B58;
    }
    .dark .craft-tag-pill {
      border: 1.5px solid #f2c200;
      background: rgba(242, 194, 0, 0.12);
      color: #f2c200;
    }
    /* Touch Target Threshold for mobile operation (>= 48px) */
    .touch-btn {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    /* Seal Stamp */
    .seal-stamp {
      display: inline-block;
      padding: 2px 8px;
      border: 2px dashed #bd3a54;
      color: #bd3a54;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-radius: 3px;
      transform: rotate(-3deg);
    }
    .seal-stamp-verified {
      border-color: #166B58;
      color: #166B58;
      transform: rotate(2deg);
    }
    .dark .seal-stamp-verified {
      border-color: #f2c200;
      color: #f2c200;
    }
    .seal-stamp-dispatched {
      border-color: #2563eb;
      color: #2563eb;
      transform: rotate(-2deg);
    }
    .dark .seal-stamp-dispatched {
      border-color: #60a5fa;
      color: #60a5fa;
    }
    /* Toast Animation */
    @keyframes toastSlide {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-toast {
      animation: toastSlide 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    /* Monospace Ledger numbers */
    .font-ledger {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
  </style>
</head>

<body class="bg-[#FCFBF7] dark:bg-[#040406] text-slate-900 dark:text-zinc-100 min-h-screen flex flex-col font-sans transition-colors duration-200 antialiased selection:bg-[#166B58] selection:text-white dark:selection:bg-[#f2c200] dark:selection:text-black">

  <!-- ================================================================= -->
  <!-- TOP MASTHEAD APP BAR -->
  <!-- ================================================================= -->
  <header class="sticky top-0 z-40 bg-[#FCFBF7]/95 dark:bg-[#040406]/95 backdrop-blur border-b-2 border-[#166B58] dark:border-[#f2c200] px-3 sm:px-4 py-2.5 shadow-sm">
    <div class="max-w-xl mx-auto flex items-center justify-between gap-2">
      <!-- Brand & Staff Pill -->
      <div class="flex items-center gap-2">
        <a href="index.html" class="flex items-center gap-1.5 focus:outline-none" title="Return to Mon Chaise Home">
          <img src="./files/monchaise_logo_green.svg" alt="Mon Chaise" class="h-6 w-auto" />
        </a>
        <div class="flex items-center gap-1">
          <span class="chapter-badge text-[10px] font-mono px-2 py-0.5 rounded font-black tracking-wider uppercase">
            STAFF PORTAL
          </span>
          <span class="inline-flex h-2 w-2 rounded-full bg-emerald-500 animate-pulse" title="Live Edge Connection"></span>
        </div>
      </div>

      <!-- Controls: Theme, Lang & Logout -->
      <div class="flex items-center gap-1.5 sm:gap-2">
        <!-- Live Clock -->
        <span id="live-clock" class="hidden sm:inline-block text-[11px] font-mono text-slate-500 dark:text-zinc-400 font-medium"></span>

        <!-- Theme Toggle -->
        <button 
          type="button" 
          id="theme-toggle-btn" 
          class="w-8 h-8 rounded bg-white dark:bg-zinc-900 border border-[#166B58]/40 dark:border-yellow-500/40 text-slate-800 dark:text-yellow-400 flex items-center justify-center shadow-[1.5px_1.5px_0px_#166B58] dark:shadow-[1.5px_1.5px_0px_#f2c200] active:translate-x-0.5 active:translate-y-0.5 transition-all"
          title="Toggle Dark/Light Mode"
          aria-label="Toggle Dark/Light Mode"
        >
          <svg id="theme-icon-moon" class="w-4 h-4 text-slate-800" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
          <svg id="theme-icon-sun" class="w-4 h-4 text-yellow-400 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        </button>

        <!-- Language Toggle -->
        <button 
          type="button" 
          id="lang-toggle-btn" 
          class="px-2.5 h-8 rounded bg-white dark:bg-zinc-900 border border-[#166B58]/40 dark:border-yellow-500/40 text-[11px] font-black text-[#166B58] dark:text-yellow-400 shadow-[1.5px_1.5px_0px_#166B58] dark:shadow-[1.5px_1.5px_0px_#f2c200] active:translate-x-0.5 active:translate-y-0.5 transition-all"
          title="Toggle Language"
        >
          <span id="lang-label">EN</span>
        </button>

        <!-- Logout Button (Shown when logged in) -->
        <button 
          type="button" 
          id="logout-btn" 
          class="hidden px-2.5 h-8 rounded bg-rose-50 dark:bg-rose-950/40 border border-rose-600/40 text-[11px] font-bold text-rose-700 dark:text-rose-400 shadow-[1.5px_1.5px_0px_#bd3a54] active:translate-x-0.5 active:translate-y-0.5 transition-all"
          title="লগআউট করুন"
        >
          <span data-i18n="logoutText">প্রস্থান</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ================================================================= -->
  <!-- SCREEN 1: PASSKEY AUTHENTICATION GATE -->
  <!-- ================================================================= -->
  <section id="passkey-screen" class="flex-1 flex flex-col justify-center max-w-xl mx-auto px-4 py-8 w-full">
    <div class="print-press-card p-6 sm:p-8 relative overflow-hidden">
      <!-- Watermark Stamp Background -->
      <div class="absolute -right-8 -bottom-8 opacity-5 dark:opacity-10 pointer-events-none">
        <img src="./files/monchaise_stamp.png" alt="" class="w-48 h-48 object-contain" />
      </div>

      <div class="text-center mb-6">
        <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded craft-tag-pill font-mono text-[11px] font-bold uppercase tracking-wider mb-3">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
          <span data-i18n="authGateBadge">স্টাফ ও পার্সেল বিতরণ বহি</span>
        </div>
        <h1 class="text-xl sm:text-2xl font-extrabold text-[#166B58] dark:text-yellow-400 font-title tracking-tight mb-2" data-i18n="authGateTitle">
          অভ্যন্তরীণ প্রবেশাধিকার (Staff Gate)
        </h1>
        <p class="text-xs text-slate-600 dark:text-zinc-400 max-w-xs mx-auto leading-relaxed" data-i18n="authGateSub">
          দৈনিক অর্ডার ম্যানেজমেন্ট ও কুরিয়ারে পার্সেল হ্যান্ডওভার করতে প্রশাসনিক পাসকি প্রদান করুন।
        </p>
      </div>

      <!-- Auth Form -->
      <form id="passkey-form" class="space-y-4" onsubmit="return false;">
        <div>
          <label for="passkey-input" class="block text-xs font-bold text-slate-700 dark:text-zinc-300 uppercase tracking-wider mb-1.5 font-mono">
            <span data-i18n="passkeyLabel">অ্যাডমিন পাসকি (Staff Passkey)</span> <span class="text-rose-600">*</span>
          </label>
          <div class="relative">
            <input 
              type="password" 
              id="passkey-input" 
              name="passkey"
              required 
              autocomplete="current-password"
              placeholder="পাসকি প্রবেশ করান..."
              class="w-full px-3.5 py-3 text-sm rounded bg-white dark:bg-zinc-900 border-2 border-[#166B58]/40 dark:border-yellow-500/40 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-zinc-500 focus:outline-none focus:border-[#166B58] dark:focus:border-yellow-400 font-mono tracking-wider transition-colors pr-10 shadow-inner"
            />
            <button 
              type="button" 
              id="toggle-passkey-visibility" 
              class="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-zinc-200 p-1"
              title="Show/Hide PIN"
            >
              <svg id="eye-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            </button>
          </div>
        </div>

        <!-- Remember Device Checkbox -->
        <div class="flex items-center gap-2 pt-1">
          <input 
            type="checkbox" 
            id="remember-device" 
            class="w-4 h-4 rounded border-2 border-[#166B58] text-[#166B58] focus:ring-0 focus:ring-offset-0 cursor-pointer accent-[#166B58]"
          />
          <label for="remember-device" class="text-xs text-slate-600 dark:text-zinc-400 cursor-pointer select-none" data-i18n="rememberDevice">
            এই ডিভাইসে লগইন মনে রাখুন (Remember this phone)
          </label>
        </div>

        <!-- Error Message Container -->
        <div id="auth-error" class="hidden p-3 rounded bg-rose-50 dark:bg-rose-950/40 border border-rose-600/40 text-xs text-rose-700 dark:text-rose-300 font-medium">
        </div>

        <!-- Submit Button (Tactile >= 48px) -->
        <button 
          type="submit" 
          id="passkey-submit-btn" 
          class="touch-btn w-full px-4 rounded bg-[#166B58] hover:bg-[#125446] dark:bg-yellow-500 dark:hover:bg-yellow-400 text-white dark:text-slate-950 font-bold text-sm tracking-wider uppercase shadow-[3px_3px_0px_#bd3a54] dark:shadow-[3px_3px_0px_#1e7e68] transition-all active:translate-x-0.5 active:translate-y-0.5 active:shadow-[1px_1px_0px_#bd3a54]"
        >
          <span id="auth-btn-text" data-i18n="authBtn">প্রবেশ করুন (Authenticate)</span>
        </button>

        <!-- Quick Local PIN helper for testing / staging -->
        <div class="pt-2 text-center">
          <button 
            type="button" 
            id="quick-pin-btn" 
            class="text-[11px] text-slate-500 dark:text-zinc-400 hover:text-[#166B58] dark:hover:text-yellow-400 underline decoration-dashed font-mono"
            title="Use default local test passkey"
          >
            টেস্ট পিন বসান (Fill 'amc-staff-2026')
          </button>
        </div>
      </form>
    </div>
  </section>

  <!-- ================================================================= -->
  <!-- SCREEN 2: MAIN STAFF DISPATCH DASHBOARD -->
  <!-- ================================================================= -->
  <main id="dashboard-screen" class="hidden flex-1 max-w-xl mx-auto px-3 sm:px-4 py-4 w-full flex flex-col gap-4">

    <!-- Status Metric Pills Bar (Filter tabs) -->
    <section class="grid grid-cols-4 gap-1.5 sm:gap-2">
      <!-- Filter: All -->
      <button 
        type="button" 
        data-filter="all" 
        class="filter-pill active-filter print-press-card p-2 text-center transition-all cursor-pointer select-none bg-white dark:bg-zinc-900 border-2 border-[#166B58] dark:border-yellow-500 shadow-[2px_2px_0px_#166B58] dark:shadow-[2px_2px_0px_#f2c200]"
      >
        <span class="block text-[10px] sm:text-xs font-bold text-slate-600 dark:text-zinc-400" data-i18n="metricAll">সব</span>
        <span id="metric-total" class="font-ledger text-sm sm:text-base font-black text-[#166B58] dark:text-yellow-400">0</span>
      </button>

      <!-- Filter: Pending -->
      <button 
        type="button" 
        data-filter="pending_verification" 
        class="filter-pill print-press-card p-2 text-center transition-all cursor-pointer select-none bg-white dark:bg-zinc-900 border-2 border-amber-600/40 dark:border-amber-500/40 opacity-85 hover:opacity-100"
      >
        <span class="block text-[10px] sm:text-xs font-bold text-amber-700 dark:text-amber-400" data-i18n="metricPending">যাচাই বাকি</span>
        <span id="metric-pending" class="font-ledger text-sm sm:text-base font-black text-amber-700 dark:text-amber-400">0</span>
      </button>

      <!-- Filter: Verified / Ready for Dispatch -->
      <button 
        type="button" 
        data-filter="verified" 
        class="filter-pill print-press-card p-2 text-center transition-all cursor-pointer select-none bg-white dark:bg-zinc-900 border-2 border-emerald-600/40 dark:border-emerald-500/40 opacity-85 hover:opacity-100"
      >
        <span class="block text-[10px] sm:text-xs font-bold text-emerald-700 dark:text-emerald-400" data-i18n="metricVerified">প্যাকিং</span>
        <span id="metric-verified" class="font-ledger text-sm sm:text-base font-black text-emerald-700 dark:text-emerald-400">0</span>
      </button>

      <!-- Filter: Dispatched -->
      <button 
        type="button" 
        data-filter="dispatched" 
        class="filter-pill print-press-card p-2 text-center transition-all cursor-pointer select-none bg-white dark:bg-zinc-900 border-2 border-blue-600/40 dark:border-blue-500/40 opacity-85 hover:opacity-100"
      >
        <span class="block text-[10px] sm:text-xs font-bold text-blue-700 dark:text-blue-400" data-i18n="metricDispatched">প্রেরিত</span>
        <span id="metric-dispatched" class="font-ledger text-sm sm:text-base font-black text-blue-700 dark:text-blue-400">0</span>
      </button>
    </section>

    <!-- Search & Quick Action Bar -->
    <section class="flex items-center gap-2">
      <div class="relative flex-1">
        <input 
          type="search" 
          id="search-input" 
          placeholder="অর্ডার আইডি, ফোন, নাম বা TrxID..."
          class="w-full pl-9 pr-8 py-2.5 text-xs sm:text-sm rounded bg-white dark:bg-zinc-900 border-2 border-[#166B58]/40 dark:border-yellow-500/40 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-zinc-500 focus:outline-none focus:border-[#166B58] dark:focus:border-yellow-400 transition-colors shadow-sm"
        />
        <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 dark:text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <button 
          type="button" 
          id="clear-search-btn" 
          class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-zinc-200 text-xs font-bold px-1"
          title="Clear search"
        >
          ✕
        </button>
      </div>

      <!-- Refresh Feed Button -->
      <button 
        type="button" 
        id="refresh-feed-btn" 
        class="touch-btn px-3 rounded bg-white dark:bg-zinc-900 border-2 border-[#166B58]/50 dark:border-yellow-500/50 text-[#166B58] dark:text-yellow-400 font-bold text-xs shadow-[2px_2px_0px_#166B58] dark:shadow-[2px_2px_0px_#f2c200] active:translate-x-0.5 active:translate-y-0.5 transition-all flex items-center gap-1.5"
        title="রিফ্রেশ করুন"
      >
        <svg id="refresh-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        <span class="hidden sm:inline" data-i18n="refreshBtn">রিফ্রেশ</span>
      </button>
    </section>

    <!-- Status Banner / Live Status Info -->
    <div id="feed-status-bar" class="flex items-center justify-between text-[11px] font-mono text-slate-500 dark:text-zinc-400 px-1">
      <span id="feed-count-text">অর্ডার লোড হচ্ছে...</span>
      <span id="feed-filter-indicator" class="text-[#166B58] dark:text-yellow-400 font-bold uppercase">ফিল্টার: সব</span>
    </div>

    <!-- ORDER FEED CONTAINER -->
    <section id="orders-feed" class="flex flex-col gap-3.5 pb-16">
      <!-- Dynamic Order Cards will be injected here -->
      <div id="feed-loading-skeleton" class="space-y-3 py-6 text-center">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-2 border-[#166B58] dark:border-yellow-400 border-t-transparent"></div>
        <p class="text-xs text-slate-500 dark:text-zinc-400 font-mono">ডাক লেজার থেকে রেকর্ড সংগৃহীত হচ্ছে...</p>
      </div>
    </section>
  </main>

  <!-- ================================================================= -->
  <!-- TOAST NOTIFICATION -->
  <!-- ================================================================= -->
  <aside 
    id="toast-notification" 
    class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 hidden max-w-sm w-[90%] bg-slate-950 text-white dark:bg-[#166B58] dark:text-white px-4 py-3 rounded shadow-2xl border-2 border-white/20 text-xs font-bold flex items-center justify-between gap-3 animate-toast"
    role="status"
    aria-live="polite"
  >
    <div class="flex items-center gap-2">
      <span id="toast-icon">✓</span>
      <span id="toast-message">সফলভাবে সম্পন্ন হয়েছে।</span>
    </div>
    <button type="button" onclick="hideToast()" class="text-white/70 hover:text-white text-sm font-bold">✕</button>
  </aside>

  <!-- ================================================================= -->
  <!-- JAVASCRIPT LOGIC -->
  <!-- ================================================================= -->
  <script>
    (function () {
      'use strict';

      // --- 1. Internationalization Dictionaries ---
      const i18n = {
        bn: {
          pageTitle: 'মঞ্চাইছে স্টাফ ও বিতরণ পোর্টাল | Staff Dispatch Portal — Mon Chaise',
          authGateBadge: 'স্টাফ ও পার্সেল বিতরণ বহি',
          authGateTitle: 'অভ্যন্তরীণ প্রবেশাধিকার (Staff Gate)',
          authGateSub: 'দৈনিক অর্ডার ম্যানেজমেন্ট ও কুরিয়ারে পার্সেল হ্যান্ডওভার করতে প্রশাসনিক পাসকি প্রদান করুন।',
          passkeyLabel: 'অ্যাডমিন পাসকি (Staff Passkey)',

      // --- 2. Digit & Currency Formatting Helpers ---
      function toBnDigits(num) {
        if (num === null || num === undefined) return '';
        const bnDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
        return String(num).replace(/[0-9]/g, d => bnDigits[d]);
      }

      function formatMoney(amount, lang) {
        const val = Number(amount) || 0;
        if (lang === 'bn') {
          return '৳ ' + toBnDigits(val.toLocaleString('en-IN'));
        }
        return 'BDT ' + val.toLocaleString('en-US');
      }

      function formatTimeAgo(isoString, lang) {
        if (!isoString) return '';
        const diffMs = Date.now() - new Date(isoString).getTime();
        const diffMins = Math.max(1, Math.floor(diffMs / 60000));
        if (diffMins < 60) {
          return lang === 'bn' ? `${toBnDigits(diffMins)} মিনিট আগে` : `${diffMins}m ago`;
        }
        const diffHours = Math.floor(diffMins / 60);
        if (diffHours < 24) {
          return lang === 'bn' ? `${toBnDigits(diffHours)} ঘণ্টা আগে` : `${diffHours}h ago`;
        }
        const diffDays = Math.floor(diffHours / 24);
        return lang === 'bn' ? `${toBnDigits(diffDays)} দিন আগে` : `${diffDays}d ago`;
      }

      // --- 3. UI Helpers: Toast & Haptics ---

        const toast = document.getElementById('toast-notification');

        const toastIcon = document.getElementById('toast-icon');
        if (!toast || !toastMsg) return;

        toastMsg.textContent = msg;
        if (toastIcon) toastIcon.textContent = icon;
        toast.classList.remove('hidden');

        if (navigator.vibrate) {
          try { navigator.vibrate(50); } catch (_) {}
        }

        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.classList.add('hidden');
        }, 3200);
      };

      window.hideToast = function() {
        const toast = document.getElementById('toast-notification');

      async function verifyPasskeyServer(key) {
        try {
          const res = await fetch('/api/staff?action=verify_passkey', {
            method: 'GET',
            headers: {
              'x-staff-passkey': key,
              'Accept': 'application/json'
            }
          });
          if (res.ok) {
            const data = await res.json().catch(() => null);
            return data && data.success;
          }
          if (res.status === 401) {
            return false;
          }
        } catch (_) {
          // On static preview servers without Cloudflare Pages Functions
        }
        // Fallback validation for local preview testing
        return key === 'amc-staff-2026';
      }

      async function handleLogin(passkey) {
        const key = String(passkey || '').trim();
        if (!key) return;

        authError.classList.add('hidden');
        passkeySubmitBtn.disabled = true;
        authBtnText.textContent = (i18n[currentLang] || i18n.bn).authBtnVerifying;

        const isValid = await verifyPasskeyServer(key);
        passkeySubmitBtn.disabled = false;
        authBtnText.textContent = (i18n[currentLang] || i18n.bn).authBtn;

        if (isValid) {
          activePasskey = key;
          sessionStorage.setItem('amc_staff_passkey', key);
          if (rememberCheckbox.checked) {
            localStorage.setItem('amc_staff_passkey', key);
          }

          passkeyScreen.classList.add('hidden');
          dashboardScreen.classList.remove('hidden');
          logoutBtn.classList.remove('hidden');

          showToast(currentLang === 'bn' ? 'স্টাফ পোর্টালে স্বাগতম!' : 'Staff authenticated successfully!');
          fetchOrders();
        } else {
          authError.textContent = (i18n[currentLang] || i18n.bn).errInvalidPasskey;
          authError.classList.remove('hidden');
        }
      }

      function handleLogout() {
        activePasskey = '';
        sessionStorage.removeItem('amc_staff_passkey');
        localStorage.removeItem('amc_staff_passkey');
        ordersCache = [];
        passkeyInput.value = '';
        authError.classList.add('hidden');

      // --- 7. Fetching & Syncing Orders ---
      async function fetchOrders() {
        const refreshIcon = document.getElementById('refresh-icon');
        if (refreshIcon) refreshIcon.classList.add('animate-spin');

        const feedStatus = document.getElementById('feed-count-text');
        if (feedStatus) feedStatus.textContent = currentLang === 'bn' ? 'অর্ডার সিঙ্ক হচ্ছে...' : 'Syncing orders...';

        try {
          const res = await fetch('/api/staff?action=orders&status=all', {
            method: 'GET',
            headers: {
              'x-staff-passkey': activePasskey,
              'Accept': 'application/json'
            }
          });

          if (res.ok) {
            const data = await res.json().catch(() => null);
            if (data && data.success && Array.isArray(data.orders)) {
              ordersCache = data.orders;
              updateMetrics(data.metrics);
              renderFeed();
              return;
            }
          } else if (res.status === 401) {
            handleLogout();
            return;
          }
        } catch (_) {
          // Fallback to offline / mock preview store
        } finally {
          if (refreshIcon) refreshIcon.classList.remove('animate-spin');
        }

        // Static fallback if API is not hosted locally
        ordersCache = JSON.parse(JSON.stringify(fallbackLocalOrders));
        updateMetrics();
        renderFeed();
      }

      // --- 8. Status Metrics Update ---
      function updateMetrics(metrics) {
        const totalCount = metrics ? metrics.total_count : ordersCache.length;

        document.getElementById('metric-total').textContent = currentLang === 'bn' ? toBnDigits(totalCount) : totalCount;
        document.getElementById('metric-pending').textContent = currentLang === 'bn' ? toBnDigits(pendingCount) : pendingCount;

        // 1. Filter by status

        // 2. Filter by search query

          list = list.filter(o => {
            const idMatch = (o.id || '').toLowerCase().includes(query);
            const nameMatch = (o.customer_name || '').toLowerCase().includes(query);
            const phoneMatch = (o.customer_phone || '').includes(query);
            const trxMatch = (o.trx_id || '').toLowerCase().includes(query);

          feedContainer.innerHTML = `
            <div class="print-press-card p-8 text-center my-4">
              <div class="text-3xl mb-2">📭</div>
              <p class="text-sm font-bold text-slate-700 dark:text-zinc-300 mb-1">${dict.noOrders}</p>
              <p class="text-xs text-slate-500 dark:text-zinc-500 font-mono">অন্য কোনো ফিল্টার বা অনুসন্ধান শব্দ যাচাই করুন।</p>
            </div>
          `;
          return;
        }

        feedContainer.innerHTML = list.map(order => renderOrderCard(order, dict)).join('');
      }

      // --- 11. Render Individual Order Card ---
      function renderOrderCard(order, dict) {
        const isBn = currentLang === 'bn';
        const cleanPhone = (order.customer_phone || '').replace(/[^0-9]/g, '');
        const waPhone = cleanPhone.startsWith('880') ? cleanPhone : ('880' + cleanPhone.replace(/^0+/, ''));
        const waMessage = encodeURIComponent(
          isBn
            ? `আসসালামু আলাইকুম ${order.customer_name || 'গ্রাহক'}, মঞ্চাইছে (Mon Chaise) থেকে আপনার অর্ডার ${order.id} সংক্রান্ত তথ্য জানাতে যোগাযোগ করছি।`
            : `Hello ${order.customer_name || 'Customer'}, reaching out from Mon Chaise regarding your order #${order.id}.`
        );

        // Status Badge styling
        let statusBadgeHtml = '';
        if (order.status === 'pending_verification') {
          statusBadgeHtml = `
            <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded text-[11px] font-bold bg-amber-50 dark:bg-amber-950/50 border border-amber-500 text-amber-800 dark:text-amber-300">
              <span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span>
              ${isBn ? 'যাচাই বাকি (Pending)' : 'Pending Verification'}
            </span>
          `;
        } else if (order.status === 'verified') {
          statusBadgeHtml = `
            <span class="seal-stamp seal-stamp-verified text-[11px]">
              ✓ ${isBn ? 'প্রস্তুত / প্যাকিং সম্পন্ন' : 'VERIFIED / READY'}
            </span>
          `;
        } else if (order.status === 'dispatched') {
          statusBadgeHtml = `
            <span class="seal-stamp seal-stamp-dispatched text-[11px]">
              🚚 ${isBn ? 'কুরিয়ারে প্রেরিত' : 'DISPATCHED'}
            </span>
          `;
        } else if (order.status === 'cancelled') {
          statusBadgeHtml = `
            <span class="seal-stamp text-[11px]">
              ✕ ${isBn ? 'অর্ডার বাতিল' : 'CANCELLED'}
            </span>
          `;
        } else {
          statusBadgeHtml = `
            <span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-bold bg-slate-100 dark:bg-zinc-800 text-slate-700 dark:text-zinc-300">
              ${order.status}
            </span>
          `;
        }

        // District Label
        const districtBadge = order.district === 'Inside Dhaka'
          ? `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-[#166B58]/10 text-[#166B58] dark:bg-yellow-400/10 dark:text-yellow-400 border border-[#166B58]/30 dark:border-yellow-400/30 font-mono">${dict.insideDhaka}</span>`
          : `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-rose-50 text-rose-700 dark:bg-rose-950/40 dark:text-rose-300 border border-rose-300 dark:border-rose-800 font-mono">${dict.outsideDhaka}</span>`;

        // Payment Info Row
        const isMFS = order.payment_method === 'mfs';
        let paymentDetailsHtml = '';
        if (isMFS) {
          paymentDetailsHtml = `
            <div class="mt-2.5 p-2.5 rounded bg-amber-50/70 dark:bg-amber-950/20 border border-amber-600/30 text-xs">
              <div class="flex items-center justify-between font-mono font-bold text-amber-900 dark:text-amber-300 mb-1">
                <span>📱 MFS সেন্ড মানি (bKash/Nagad)</span>
                <span>${order.sender_number ? (isBn ? toBnDigits(order.sender_number) : order.sender_number) : '—'}</span>
              </div>
              <div class="flex items-center justify-between gap-2 pt-1 border-t border-amber-600/20">
                <div class="font-mono text-xs font-black tracking-wider text-slate-900 dark:text-amber-200">
                  TrxID: <span class="bg-white dark:bg-zinc-900 px-1.5 py-0.5 rounded border border-amber-500/40 select-all">${order.trx_id || 'N/A'}</span>
                </div>
                ${order.trx_id ? `
                  <button 
                    type="button" 
                    onclick="copyToClipboard('${order.trx_id}', this)" 
                    class="touch-btn h-8 px-2.5 rounded bg-white dark:bg-zinc-900 border border-amber-600/50 text-[11px] font-bold text-amber-800 dark:text-amber-300 shadow-sm active:scale-95 transition-all"
                  >
                    ${dict.copyTrx}
                  </button>
                ` : ''}
              </div>
            </div>
          `;
        } else {
          paymentDetailsHtml = `
            <div class="mt-2.5 p-2 rounded bg-slate-50 dark:bg-zinc-900/60 border border-slate-200 dark:border-zinc-800 text-xs flex items-center justify-between">
              <span class="font-bold text-slate-700 dark:text-zinc-300 font-mono">💵 ক্যাশ অন ডেলিভারি (COD)</span>
              <span class="text-[11px] text-slate-500 dark:text-zinc-400">ডেলিভারির সময় নগদ আদায়</span>
            </div>
          `;
        }

        // Items Breakdown
        const itemsListHtml = (order.items || []).map(it => `
          <li class="flex items-center justify-between text-xs py-1 border-b border-dashed border-slate-200 dark:border-zinc-800 last:border-b-0">
            <span class="truncate pr-2 font-medium text-slate-800 dark:text-zinc-200">${it.title}</span>
            <span class="font-mono font-bold text-slate-900 dark:text-zinc-100 whitespace-nowrap">
              ${isBn ? toBnDigits(it.quantity) : it.quantity} × ${formatMoney(it.unit_price_bdt, currentLang)}
            </span>
          </li>
        `).join('');

        // Action Section by Status
        let actionAreaHtml = '';
        if (order.status === 'pending_verification') {
          actionAreaHtml = `
            <div class="pt-3 border-t-2 border-[#166B58]/20 dark:border-yellow-500/30 flex items-center gap-2">
              <button 
                type="button" 
                onclick="transitionOrder('${order.id}', 'verify_payment', this)" 
                class="touch-btn flex-1 px-3 rounded bg-[#166B58] hover:bg-[#125446] dark:bg-yellow-500 dark:hover:bg-yellow-400 text-white dark:text-slate-950 font-bold text-xs sm:text-sm tracking-wide shadow-[2px_2px_0px_#bd3a54] dark:shadow-[2px_2px_0px_#1e7e68] active:translate-x-0.5 active:translate-y-0.5 transition-all"
              >
                ${dict.verifyPayBtn}
              </button>
              <button 
                type="button" 
                onclick="transitionOrder('${order.id}', 'cancel_order', this)" 
                class="touch-btn px-3 rounded bg-rose-50 dark:bg-rose-950/30 border border-rose-600/40 text-rose-700 dark:text-rose-400 font-bold text-xs hover:bg-rose-100 transition-all active:scale-95"
              >
                ${dict.cancelOrderBtn}
              </button>
            </div>
          `;
        } else if (order.status === 'verified') {
          actionAreaHtml = `
            <div class="pt-3 border-t-2 border-[#166B58]/20 dark:border-yellow-500/30 space-y-2">
              <div class="text-[11px] font-bold text-emerald-800 dark:text-emerald-300 flex items-center gap-1.5">
                <span>📦 পার্সেল প্রস্তুত। কুরিয়ারে হস্তান্তর তথ্য এন্ট্রি করুন:</span>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <select 
                  id="courier-select-${order.id}" 
                  class="w-full px-2.5 py-2 text-xs rounded bg-white dark:bg-zinc-900 border border-[#166B58]/40 dark:border-yellow-500/40 text-slate-800 dark:text-zinc-200 font-medium focus:outline-none focus:border-[#166B58]"
                >
                  <option value="Steadfast Courier" selected>Steadfast Courier (স্টেডফাস্ট)</option>
                  <option value="Pathao Courier">Pathao Courier (পাঠাও)</option>
                  <option value="RedX">RedX (রেডএক্স)</option>
                  <option value="Paperfly">Paperfly (পেপারফ্লাই)</option>
                  <option value="Sundarban Courier">Sundarban (সুন্দরবন)</option>
                  <option value="Other">অন্যান্য (Other)</option>
                </select>
                <input 
                  type="text" 
                  id="tracking-input-${order.id}" 
                  placeholder="${dict.trackingPlaceholder}" 
                  class="w-full px-2.5 py-2 text-xs rounded bg-white dark:bg-zinc-900 border border-[#166B58]/40 dark:border-yellow-500/40 text-slate-800 dark:text-zinc-200 font-mono uppercase focus:outline-none focus:border-[#166B58]"
                />
              </div>
              <button 
                type="button" 
                onclick="submitDispatch('${order.id}', this)" 
                class="touch-btn w-full px-3 rounded bg-[#166B58] hover:bg-[#125446] dark:bg-yellow-500 dark:hover:bg-yellow-400 text-white dark:text-slate-950 font-bold text-xs sm:text-sm tracking-wide shadow-[2px_2px_0px_#166B58] dark:shadow-[2px_2px_0px_#f2c200] active:translate-x-0.5 active:translate-y-0.5 transition-all"
              >
                ${dict.dispatchBtn}
              </button>
            </div>
          `;
        } else if (order.status === 'dispatched') {
          let directCourierUrl = null;
          const cName = String(order.courier_name || '').toLowerCase();
          const tCode = order.tracking_code || '';
          if (cName.includes('steadfast') && tCode) {
            directCourierUrl = `https://steadfast.com.bd/t/${encodeURIComponent(tCode)}`;
          } else if (cName.includes('pathao') && tCode) {
            directCourierUrl = `https://pathao.com/courier-tracking/?consignment_id=${encodeURIComponent(tCode)}`;
          }

          actionAreaHtml = `
            <div class="pt-3 border-t-2 border-blue-600/20 dark:border-blue-500/30">
              <div class="p-2.5 rounded bg-blue-50/70 dark:bg-blue-950/20 border border-blue-600/30 flex flex-col gap-2">
                <div class="flex items-center justify-between text-xs">
                  <span class="font-bold text-blue-900 dark:text-blue-300">🚚 ${order.courier_name || 'Courier'}</span>
                  <span class="font-mono font-black text-slate-900 dark:text-zinc-100 bg-white dark:bg-zinc-900 px-2 py-0.5 rounded border border-blue-400/40">
                    ${tCode || 'N/A'}
                  </span>
                </div>
                <div class="flex items-center gap-2 pt-1">
                  ${directCourierUrl ? `
                    <a 
                      href="${directCourierUrl}" 
                      target="_blank" 
                      rel="noopener noreferrer" 
                      class="touch-btn flex-1 px-2.5 rounded bg-blue-600 hover:bg-blue-700 text-white text-[11px] font-bold shadow-sm text-center"
                    >
                      ${dict.trackCourierBtn}
                    </a>
                  ` : ''}
                  ${tCode ? `
                    <button 
                      type="button" 
                      onclick="copyToClipboard('${tCode}', this)" 
                      class="touch-btn px-3 rounded bg-white dark:bg-zinc-900 border border-blue-600/40 text-blue-800 dark:text-blue-300 text-[11px] font-bold shadow-sm"
                    >
                      কপি কোড
                    </button>
                  ` : ''}
                </div>
              </div>
            </div>
          `;
        }

        return `
          <article class="print-press-card p-4 sm:p-5 flex flex-col gap-3 transition-shadow duration-150" id="card-${order.id}">
            <!-- Header Row: ID, Time, Badge -->
            <div class="flex items-start justify-between gap-2 border-b border-[#166B58]/20 dark:border-yellow-500/20 pb-2.5">
              <div>
                <span class="font-ledger text-sm sm:text-base font-black text-[#166B58] dark:text-yellow-400 select-all tracking-wider">
                  #${order.id}
                </span>
                <span class="block text-[11px] text-slate-500 dark:text-zinc-400 font-mono">
                  ${formatTimeAgo(order.created_at, currentLang)}
                </span>
              </div>
              <div class="text-right">
                ${statusBadgeHtml}
              </div>
            </div>

            <!-- Customer Details & Quick Contact Links (Touch Targets >= 48px) -->
            <div class="space-y-1">
              <div class="flex items-center justify-between gap-2">
                <span class="text-sm font-bold text-slate-900 dark:text-white">${order.customer_name || 'গ্রাহক'}</span>
                ${districtBadge}
              </div>
              <p class="text-xs text-slate-600 dark:text-zinc-300 leading-relaxed font-sans">
                📍 ${order.shipping_address || 'ঠিকানা পাওয়া যায়নি'}
              </p>
            </div>

            <!-- Phone & WhatsApp Touch Buttons (>= 48px) -->
            <div class="grid grid-cols-2 gap-2 pt-1">
              <a 
                href="tel:${cleanPhone}" 
                class="touch-btn rounded bg-white dark:bg-zinc-900 border border-[#166B58]/40 dark:border-yellow-500/40 text-xs font-bold text-slate-800 dark:text-zinc-100 shadow-[1.5px_1.5px_0px_#166B58] dark:shadow-[1.5px_1.5px_0px_#f2c200] active:translate-x-0.5 active:translate-y-0.5 transition-all text-center"
              >
                ${dict.callBtn}
              </a>
              <a 
                href="https://wa.me/${waPhone}?text=${waMessage}" 
                target="_blank" 
                rel="noopener noreferrer" 
                class="touch-btn rounded bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-600/40 text-xs font-bold text-emerald-800 dark:text-emerald-300 shadow-[1.5px_1.5px_0px_#059669] active:translate-x-0.5 active:translate-y-0.5 transition-all text-center"
              >
                ${dict.waBtn}
              </a>
            </div>

            <!-- Payment Row -->
            ${paymentDetailsHtml}

            <!-- Items & Financial Summary -->
            <div class="bg-white/60 dark:bg-zinc-900/40 p-2.5 rounded border border-slate-200 dark:border-zinc-800 space-y-1.5">
              <div class="text-[11px] font-mono font-bold text-slate-500 dark:text-zinc-400 uppercase tracking-wider">
                ${dict.itemsLabel}
              </div>
              <ul class="space-y-0.5">
                ${itemsListHtml}
              </ul>
              <div class="pt-2 border-t border-slate-200 dark:border-zinc-700 flex items-center justify-between font-mono font-bold text-xs sm:text-sm">
                <span class="text-slate-600 dark:text-zinc-300">মোট টাকা (Total Amount):</span>
                <span class="text-[#166B58] dark:text-yellow-400 text-sm font-black">
                  ${formatMoney(order.total_amount_bdt, currentLang)}
                </span>
              </div>
            </div>

            <!-- Customer Notes if present -->
            ${order.customer_notes ? `
              <div class="p-2 rounded bg-yellow-50 dark:bg-yellow-950/20 border-l-2 border-yellow-500 text-xs text-yellow-900 dark:text-yellow-200 italic font-sans">
                "${order.customer_notes}"
              </div>
            ` : ''}

            <!-- Action Area -->
            ${actionAreaHtml}
          </article>
        `;
      }

      // --- 12. Actions: Verify, Mark Dispatched, Cancel, Copy ---
      window.copyToClipboard = async function(text, btnElement) {
        if (!text) return;
        try {
          await navigator.clipboard.writeText(text);
          if (btnElement) {
            const orig = btnElement.textContent;
            btnElement.textContent = (i18n[currentLang] || i18n.bn).copiedTrx;
            setTimeout(() => { btnElement.textContent = orig; }, 1800);
          }
          showToast(`কপি হয়েছে: ${text}`);
        } catch (err) {
          // Fallback prompt
          window.prompt('কপি করতে চাপুন (Ctrl+C / Cmd+C):', text);
        }
      };

      window.transitionOrder = async function(orderId, action, btnElement) {
        const order = ordersCache.find(o => o.id === orderId);
        if (!order) return;

        if (action === 'cancel_order') {
          const confirmCancel = window.confirm(
            currentLang === 'bn' 
              ? `আপনি কি নিশ্চিতভাবে অর্ডার #${orderId} বাতিল করতে চান?` 
              : `Are you sure you want to cancel order #${orderId}?`
          );
          if (!confirmCancel) return;
        }

        if (btnElement) {
          btnElement.disabled = true;
          btnElement.textContent = action === 'verify_payment' 
            ? (i18n[currentLang] || i18n.bn).verifyingPay
            : (i18n[currentLang] || i18n.bn).cancellingOrder;
        }

        try {
          const res = await fetch('/api/staff', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-staff-passkey': activePasskey
            },
            body: JSON.stringify({
              order_id: orderId,
              action: action
            })
          });

          if (res.ok) {
            const data = await res.json().catch(() => null);
            if (data && data.success && data.order) {
              // Optimistic update from response
              const idx = ordersCache.findIndex(o => o.id === orderId);
              if (idx !== -1) ordersCache[idx] = data.order;
              updateMetrics();
              renderFeed();
              showToast(data.message || 'অর্ডার স্ট্যাটাস সফলভাবে পরিবর্তিত হয়েছে।');
              return;
            }
          }
        } catch (_) {
          // Static local preview fallback
        }

        // Optimistic local state transition
        if (action === 'verify_payment') {
          order.status = 'verified';
          order.updated_at = new Date().toISOString();
          showToast(`অর্ডার #${orderId} পেমেন্ট যাচাই সম্পন্ন!`);
        } else if (action === 'cancel_order') {
          order.status = 'cancelled';
          order.updated_at = new Date().toISOString();
          showToast(`অর্ডার #${orderId} বাতিল করা হয়েছে।`, '✕');
        }

        updateMetrics();
        renderFeed();
      };

      window.submitDispatch = async function(orderId, btnElement) {
        const order = ordersCache.find(o => o.id === orderId);
        if (!order) return;

        const courierSelect = document.getElementById(`courier-select-${orderId}`);
        const trackingInput = document.getElementById(`tracking-input-${orderId}`);

        const courierName = courierSelect ? courierSelect.value : 'Steadfast Courier';
        const trackingCode = trackingInput ? trackingInput.value.trim() : '';

        if (!trackingCode) {
          alert(currentLang === 'bn' ? 'অনুগ্রহ করে কুরিয়ার ট্র্যাকিং কোড দিন।' : 'Please enter the tracking code.');
          if (trackingInput) trackingInput.focus();
          return;
        }

        if (btnElement) {
          btnElement.disabled = true;
          btnElement.textContent = (i18n[currentLang] || i18n.bn).dispatchingBtn;
        }

        try {
          const res = await fetch('/api/staff', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-staff-passkey': activePasskey
            },
            body: JSON.stringify({
              order_id: orderId,
              action: 'mark_dispatched',
              courier_name: courierName,
              tracking_code: trackingCode
            })
          });

          if (res.ok) {
            const data = await res.json().catch(() => null);
            if (data && data.success && data.order) {
              const idx = ordersCache.findIndex(o => o.id === orderId);
              if (idx !== -1) ordersCache[idx] = data.order;
              updateMetrics();
              renderFeed();
              showToast(data.message || `অর্ডার #${orderId} সফলভাবে কুরিয়ারে হস্তান্তর হয়েছে!`);
              return;
            }
          }
        } catch (_) {
          // Static preview fallback
        }

        // Optimistic local state transition
        order.status = 'dispatched';
        order.courier_name = courierName;
        order.tracking_code = trackingCode;
        order.updated_at = new Date().toISOString();

        updateMetrics();
        renderFeed();
        showToast(`অর্ডার #${orderId} সফলভাবে কুরিয়ারে হস্তান্তর হয়েছে!`, '🚚');
      };

      // --- 13. Initialization & Event Listeners ---
      document.getElementById('theme-toggle-btn').addEventListener('click', toggleTheme);
      document.getElementById('lang-toggle-btn').addEventListener('click', () => {
        applyLanguage(currentLang === 'bn' ? 'en' : 'bn');
      });

      // Startup
      initTheme();
      applyLanguage(currentLang);

      // Auto-login if session passkey exists
      if (activePasskey) {
        passkeyScreen.classList.add('hidden');
        dashboardScreen.classList.remove('hidden');
        logoutBtn.classList.remove('hidden');
        fetchOrders();
      }
    })();
  </script>
</body>
</html>
