<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 96" width="100%" height="96" preserveAspectRatio="none">
  <defs>
    <!-- Seamless Pattern Unit for 40px tile -->
    <pattern id="handloomTile" width="40" height="96" patternUnits="userSpaceOnUse">
      <!-- Background deep black -->
      <rect width="40" height="96" fill="#070709" />

      <!-- === SECTION 1: Top Red Woven Band (0 to 18) === -->
      <rect y="0" width="40" height="18" fill="#140203" />
      <!-- Herringbone / chevron weave stitches in crimson -->
      <g stroke="#d92525" stroke-width="2" stroke-linecap="round" opacity="0.9">
        <path d="M0,3 L5,9 L0,15 M10,3 L15,9 L10,15 M20,3 L25,9 L20,15 M30,3 L35,9 L30,15" />
        <path d="M5,9 L10,3 M15,9 L20,3 M25,9 L30,3 M35,9 L40,3" stroke="#b01b1b" />
        <path d="M5,9 L10,15 M15,9 L20,15 M25,9 L30,15 M35,9 L40,15" stroke="#ef4444" />
      </g>

      <!-- Golden Stitched Rule (18-22) -->
      <line x1="0" y1="20" x2="40" y2="20" stroke="#f2c200" stroke-width="1.8" stroke-dasharray="3, 3" />
      <line x1="1.5" y1="22" x2="40" y2="22" stroke="#dc2626" stroke-width="1" stroke-dasharray="2, 4" />

      <!-- Black spacing band (22-28) -->
      <rect y="22" width="40" height="6" fill="#09090c" />

      <!-- === SECTION 2: Crimson Triangle / Chevron Teeth (28-40) === -->
      <!-- Teeth pointing downwards -->
      <polygon points="0,28 10,28 5,37" fill="#dc2626" />
      <polygon points="10,28 20,28 15,37" fill="#b91c1c" />
      <polygon points="20,28 30,28 25,37" fill="#dc2626" />
      <polygon points="30,28 40,28 35,37" fill="#b91c1c" />
      <!-- Golden micro-dot accent below each tooth -->
      <circle cx="5" cy="40" r="1.2" fill="#f2c200" />
      <circle cx="15" cy="40" r="1.2" fill="#f2c200" />
      <circle cx="25" cy="40" r="1.2" fill="#f2c200" />
      <circle cx="35" cy="40" r="1.2" fill="#f2c200" />

      <!-- Black band with stitch line (42-48) -->
      <rect y="42" width="40" height="7" fill="#060608" />
      <line x1="0" y1="46" x2="40" y2="46" stroke="#f2c200" stroke-width="1.2" stroke-dasharray="4, 2" />

      <!-- === SECTION 3: Golden Stepped Temple / Stupa Motifs (49-68) === -->
      <!-- Traditional 3-tier stepped pyramid motif in golden yellow -->
      <!-- Motif 1 centered at x=10 -->
      <g fill="#f2c200">
        <!-- Tier 1 (Base) -->
        <rect x="2" y="65" width="16" height="3" rx="0.5" />
        <!-- Tier 2 (Middle) -->
        <rect x="5" y="60" width="10" height="3" rx="0.5" />
        <!-- Tier 3 (Top) -->
        <rect x="7" y="55" width="6" height="3" rx="0.5" />
        <!-- Spire tip -->
        <polygon points="10,50 8,54 12,54" />
      </g>
      <!-- Motif 2 centered at x=30 -->
      <g fill="#f2c200">
        <!-- Tier 1 (Base) -->
        <rect x="22" y="65" width="16" height="3" rx="0.5" />
        <!-- Tier 2 (Middle) -->
        <rect x="25" y="60" width="10" height="3" rx="0.5" />
        <!-- Tier 3 (Top) -->
        <rect x="27" y="55" width="6" height="3" rx="0.5" />
        <!-- Spire tip -->
        <polygon points="30,50 28,54 32,54" />
      </g>

      <!-- Stitch line under temples (69-72) -->
      <line x1="0" y1="71" x2="40" y2="71" stroke="#dc2626" stroke-width="1.5" />
      <line x1="0" y1="73" x2="40" y2="73" stroke="#f2c200" stroke-width="1.2" stroke-dasharray="3, 3" />

      <!-- === SECTION 4: Bottom Crimson Heavy Woven Band (74-96) === -->
      <rect y="74" width="40" height="22" fill="#140203" />
      <g stroke="#e02929" stroke-width="2.2" stroke-linecap="round">
        <!-- Interlacing diagonal weave -->
        <path d="M0,76 L8,84 L0,92 M10,76 L18,84 L10,92 M20,76 L28,84 L20,92 M30,76 L38,84 L30,92" />
        <path d="M8,84 L16,76 M18,84 L26,76 M28,84 L36,76 M38,84 L46,76" stroke="#991414" />
        <path d="M8,84 L16,92 M18,84 L26,92 M28,84 L36,92 M38,84 L46,92" stroke="#ff4d4d" />
      </g>
      <!-- Ending golden edge line -->
      <line x1="0" y1="95" x2="40" y2="95" stroke="#f2c200" stroke-width="1.5" />
    </pattern>
  </defs>

  <!-- Render repeating tile across full width -->
  <rect width="100%" height="96" fill="url(#handloomTile)" />
</svg>
