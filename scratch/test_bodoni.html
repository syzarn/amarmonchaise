<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    @font-face {
      font-family: 'Bodoni24Encoded';
      src: url('../files/Bodoni%2024/Bodoni-24-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: 'Bodoni24Raw';
      src: url('../files/Bodoni 24/Bodoni-24-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: 'BodoniBookEncoded';
      src: url('../files/Bodoni%2024/Bodoni-24-Book.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }
    .encoded { font-family: 'Bodoni24Encoded', monospace; font-weight: 700; font-size: 32px; }
    .raw { font-family: 'Bodoni24Raw', monospace; font-weight: 700; font-size: 32px; }
    .book { font-family: 'BodoniBookEncoded', monospace; font-weight: 400; font-size: 32px; }
    .mono { font-family: monospace; font-weight: 700; font-size: 32px; }
  </style>
</head>
<body>
  <div id="encoded" class="encoded">Traditional Handloom Thami (Chakma Weave)</div>
  <div id="raw" class="raw">Traditional Handloom Thami (Chakma Weave)</div>
  <div id="book" class="book">Traditional Handloom Thami (Chakma Weave)</div>
  <div id="mono" class="mono">Traditional Handloom Thami (Chakma Weave)</div>
</body>
</html>
