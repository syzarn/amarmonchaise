<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad1_mustard-candle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f7f5"/>
    </radialGradient>
    <filter id="shadow_mustard-candle" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#125446" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bgGrad1_mustard-candle)"/>
  <!-- Nakshikantha Stitching Border -->
  <rect x="24" y="24" width="752" height="752" rx="28" fill="none" stroke="#166b58" stroke-width="2" stroke-dasharray="8 6" opacity="0.4"/>
  <rect x="36" y="36" width="728" height="728" rx="20" fill="none" stroke="#bd3a54" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.3"/>
  
  <!-- Slide Badge -->
  <g transform="translate(48, 54)">
    <rect width="140" height="32" rx="16" fill="#166b58" fill-opacity="0.08" stroke="#166b58" stroke-width="1"/>
    <text x="70" y="20" text-anchor="middle" font-family="'Purno', serif" font-size="13" font-weight="bold" fill="#166b58">১. মূল প্রদর্শনী</text>
  </g>
  <g transform="translate(680, 54)">
    <text x="60" y="20" text-anchor="end" font-family="'GaramondHalhed', serif" font-size="14" font-weight="bold" fill="#94a3b8">#amc-107</text>
  </g>

  <!-- Centered Hero Illustration -->
  <g transform="translate(400, 380) scale(4.2)" filter="url(#shadow_mustard-candle)">
    <g transform="translate(-32, -32)">
      <svg class="w-32 h-32" viewBox="0 0 64 64" fill="none">
        <rect x="20" y="26" width="24" height="30" rx="3" stroke="#1e7e68" stroke-width="3" fill="#f8faf9"/>
        <path d="M32 14c4 4 4 8 0 12-4-4-4-8 0-12z" fill="#bd3a54" stroke="#1e7e68" stroke-width="1.5"/>
        <line x1="32" y1="22" x2="32" y2="26" stroke="#1e7e68" stroke-width="2"/>
      </svg>
    </g>
  </g>

  <!-- Bottom Captions -->
  <g transform="translate(400, 710)" text-anchor="middle">
    <text y="0" font-family="'Purno', serif" font-size="20" font-weight="bold" fill="#0f172a">সরিষা ফুলের মৌতাত সয়া মোমবাতি</text>
    <text y="24" font-family="'GaramondHalhed', serif" font-size="14" fill="#64748b">Mustard Bloom Soy Scented Candle</text>
  </g>
</svg>