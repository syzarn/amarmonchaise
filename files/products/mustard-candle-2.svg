  <g transform="translate(400, 710)" text-anchor="middle">
    <text y="0" font-family="'Purno', serif" font-size="18" font-weight="bold" fill="#0f172a">ঐতিহ্যবাহী হস্তশিল্প ও উপাদানের বিস্তারিত</text>
