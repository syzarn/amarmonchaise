<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad1_pocket-astrolabe" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f7f5"/>
    </radialGradient>
    <filter id="shadow_pocket-astrolabe" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#125446" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bgGrad1_pocket-astrolabe)"/>
  <!-- Nakshikantha Stitching Border -->
  <rect x="24" y="24" width="752" height="752" rx="28" fill="none" stroke="#166b58" stroke-width="2" stroke-dasharray="8 6" opacity="0.4"/>
  <rect x="36" y="36" width="728" height="728" rx="20" fill="none" stroke="#bd3a54" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.3"/>
  
  <!-- Slide Badge -->
  <g transform="translate(48, 54)">
    <rect width="140" height="32" rx="16" fill="#166b58" fill-opacity="0.08" stroke="#166b58" stroke-width="1"/>
    <text x="70" y="20" text-anchor="middle" font-family="'Purno', serif" font-size="13" font-weight="bold" fill="#166b58">১. মূল প্রদর্শনী</text>
  </g>
  <g transform="translate(680, 54)">
    <text x="60" y="20" text-anchor="end" font-family="'GaramondHalhed', serif" font-size="14" font-weight="bold" fill="#94a3b8">#amc-110</text>
  </g>

  <!-- Centered Hero Illustration -->
  <g transform="translate(400, 380) scale(4.2)" filter="url(#shadow_pocket-astrolabe)">
    <g transform="translate(-32, -32)">
      <svg class="w-32 h-32" viewBox="0 0 64 64" fill="none">
        <circle cx="32" cy="34" r="22" stroke="#1e7e68" stroke-width="3" fill="#f8faf9"/>
        <circle cx="32" cy="10" r="5" stroke="#1e7e68" stroke-width="2"/>
        <polygon points="32,20 36,34 32,48 28,34" fill="#bd3a54"/>
      </svg>
    </g>
  </g>

  <!-- Bottom Captions -->
  <g transform="translate(400, 710)" text-anchor="middle">
    <text y="0" font-family="'Purno', serif" font-size="20" font-weight="bold" fill="#0f172a">খাঁটি পিতলের প্রাচীন পকেট দিকনির্ণায়ক</text>
    <text y="24" font-family="'GaramondHalhed', serif" font-size="14" fill="#64748b">Solid Brass Ancient Pocket Astrolabe</text>
  </g>
</svg>